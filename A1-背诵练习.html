<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A1 德语背诵练习</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#20342d; --muted:#718078; --paper:#fffdf7; --green:#176b50; --green-pale:#e5f3eb;
      --red:#a9433f; --red-pale:#fbebe8; --blue:#285e50; --line:#d9e2d9; --gold:#c49a58;
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      height:100vh; height:100dvh; overflow:hidden; color:var(--ink);
      background:radial-gradient(ellipse at 12% 8%,#e5eee5 0,transparent 34%),radial-gradient(ellipse at 92% 92%,#f3e7d1 0,transparent 36%),#f4f2e9;
      font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    }
    main {
      width:min(100%,1680px); height:100%; min-height:0; margin:auto; padding:clamp(12px,2.4vw,34px);
      display:grid; grid-template-rows:auto minmax(0,1fr); gap:clamp(10px,1.8vh,20px);
    }
    header { display:flex; justify-content:space-between; gap:20px; align-items:center; min-width:0; }
    .eyebrow { display:block; margin-bottom:5px; color:#8a7045; font-size:.72rem; font-weight:800; letter-spacing:.18em; }
    h1 { margin:0; font-family:"Noto Serif SC","Songti SC",serif; font-size:clamp(1.45rem,3vw,2.25rem); letter-spacing:.04em; line-height:1.15; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:clamp(.78rem,1.1vw,.92rem); line-height:1.45; }
    .count { flex:none; white-space:nowrap; padding:10px 15px; border:1px solid #e7e2d4; border-radius:14px; background:#fffdf8c9; color:var(--blue); font-size:.9rem; font-weight:800; box-shadow:0 5px 18px #394c3b0c; }
    .panel {
      position:relative; min-width:0; min-height:0; overflow:hidden; padding:clamp(16px,2.4vw,34px);
      display:grid; grid-template-columns:minmax(220px,.62fr) minmax(0,1.75fr); gap:clamp(18px,3vw,46px);
      border:1px solid #ffffffc9; border-radius:clamp(18px,2vw,30px); background:#fffdf7e8;
      box-shadow:0 24px 70px #31493b13,0 2px 8px #31493b08; backdrop-filter:blur(12px);
    }
    .rail { min-width:0; min-height:0; padding:8px clamp(16px,2.4vw,34px) 8px 4px; border-right:1px solid #e8e4d8; display:flex; flex-direction:column; }
    .filters { display:grid; grid-template-columns:1fr; gap:16px; }
    label { display:block; color:#52665c; font-size:.82rem; font-weight:750; letter-spacing:.02em; }
    select, input {
      width:100%; min-width:0; border:1px solid var(--line); border-radius:12px; padding:12px 13px; margin-top:7px;
      background:#fffefa; color:var(--ink); font:inherit; box-shadow:0 2px 5px #31493b08;
    }
    select:focus, input:focus { outline:3px solid #d4e4d5; border-color:#6b9a7f; }
    .round-progress { margin-top:clamp(24px,5vh,58px); }
    .progress-caption { margin-bottom:9px; color:#65776c; font-size:.77rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .progress { height:7px; background:#e8ece4; border-radius:99px; overflow:hidden; }
    .progress > div { height:100%; width:0; border-radius:inherit; transition:width .25s ease; background:linear-gradient(90deg,#54856b,#b0a06f); }
    .footer { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:auto; padding-top:20px; color:var(--muted); font-size:.82rem; }
    #status { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .notice { margin:13px 0 0; color:#879189; font-size:.72rem; line-height:1.55; }
    .study { min-width:0; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) auto; gap:clamp(8px,1.7vh,18px); }
    .question { min-width:0; min-height:0; display:flex; flex-direction:column; justify-content:center; padding:clamp(8px,1.2vw,18px) 0; }
    .question-overline { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
    .tag { display:inline-block; color:#32674f; background:#eaf1e8; padding:6px 11px; border-radius:99px; font-size:.75rem; font-weight:800; letter-spacing:.03em; }
    .prompt-label { color:#839087; margin:clamp(18px,3.8vh,42px) 0 7px; font-size:.88rem; }
    #meaning { flex:1; min-height:0; display:flex; align-items:center; overflow-wrap:anywhere; font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",serif; font-size:clamp(1.65rem,4.5vw,3.6rem); font-weight:700; line-height:1.38; letter-spacing:.015em; }
    .hint { min-height:20px; margin:8px 0 0; color:#879189; font-size:.78rem; }
    .answer-controls { min-width:0; }
    .answer-label { color:#52665c; }
    .actions { display:flex; align-items:stretch; gap:9px; flex-wrap:wrap; margin-top:11px; }
    button {
      appearance:none; min-height:43px; border:1px solid transparent; border-radius:11px; padding:10px 14px;
      font:inherit; font-size:.84rem; font-weight:750; cursor:pointer; white-space:nowrap; background:#edf0e9; color:#34483c;
      transition:background-color .16s ease,border-color .16s ease,transform .16s ease;
    }
    button:hover:not(:disabled) { transform:translateY(-1px); background:#e2e9df; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button.primary { color:#fff; background:var(--blue); }
    button.primary:hover:not(:disabled) { background:#204e42; }
    button:focus-visible { outline:3px solid #c7d9c9; outline-offset:2px; }
    #feedback { height:48px; min-height:48px; max-height:48px; overflow:auto; visibility:hidden; margin-top:10px; border-radius:11px; padding:11px 14px; line-height:1.5; font-size:.88rem; }
    #feedback.ok, #feedback.no { visibility:visible; }
    #feedback.ok { color:#175b43; background:var(--green-pale); }
    #feedback.no { color:#98413b; background:var(--red-pale); }
    #feedback strong { font-family:system-ui,sans-serif; }
    #errorBook {
      position:absolute; z-index:5; inset:clamp(12px,2vw,28px); display:none; grid-template-rows:auto auto minmax(0,1fr) auto;
      overflow:hidden; padding:clamp(18px,2.8vw,38px); border:1px solid #ead9b8; border-radius:22px;
      background:#fffaf0; box-shadow:0 18px 60px #26352e32; animation:errorFade .16s ease-out;
    }
    #errorBook.show { display:grid; }
    #errorBook h2 { margin:0 0 8px; font-family:"Noto Serif SC","Songti SC",serif; font-size:clamp(1.3rem,2vw,1.8rem); }
    #errorBook p { margin:4px 0 16px; color:#7d7159; font-size:.9rem; }
    #errorList { min-height:0; overflow:auto; margin:0 0 14px; padding-left:22px; color:#5f4b2d; line-height:1.65; font-size:.9rem; }
    #errorList li { margin:8px 0; } .wrong-answer { color:#a9433f; }
    @keyframes errorFade { from { opacity:0; } to { opacity:1; } }
    @media (max-width:760px) {
      main { padding:clamp(9px,2vw,18px); gap:10px; }
      header { gap:10px; }
      .panel { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:10px; padding:14px; }
      .rail { padding:0 0 11px; border-right:0; border-bottom:1px solid #e8e4d8; display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
      .filters { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:9px; }
      select { padding:9px 10px; margin-top:4px; border-radius:10px; font-size:.84rem; }
      .round-progress { margin:0; display:grid; grid-template-columns:auto minmax(60px,1fr); gap:10px; align-items:center; }
      .progress-caption { margin:0; font-size:.67rem; }
      .footer { margin:0; padding:0; }
      .notice { display:none; }
      .study { gap:8px; }
      .question { padding:2px 0; }
      .prompt-label { margin:clamp(10px,2vh,20px) 0 5px; }
      #meaning { font-size:clamp(1.65rem,7vw,2.8rem); }
      .actions { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:7px; margin-top:8px; }
      .actions button { grid-column:span 2; min-width:0; padding:9px 5px; font-size:.76rem; }
      #check, #speak { grid-column:span 3; }
      #feedback { height:42px; min-height:42px; max-height:42px; margin-top:7px; padding:9px 11px; font-size:.8rem; }
      #errorBook { inset:7px; padding:18px; }
    }
    @media (max-width:430px) {
      h1 { font-size:1.3rem; }
      .eyebrow { margin-bottom:3px; font-size:.62rem; }
      .subtitle { max-width:245px; font-size:.72rem; }
      .count { padding:8px 9px; font-size:.75rem; border-radius:11px; }
      .panel { padding:11px; }
      .rail { gap:7px; }
      .filters { gap:7px; }
      label { font-size:.72rem; }
      .footer { font-size:.72rem; }
      .footer button { min-height:34px; padding:6px 9px; font-size:.72rem; }
    }
    @media (max-height:660px) {
      main { padding-top:8px; padding-bottom:8px; gap:8px; }
      .eyebrow { display:none; }
      .subtitle { margin-top:3px; }
      .round-progress { margin-top:18px; }
      .footer { padding-top:10px; }
      .prompt-label { margin-top:14px; }
      #feedback { height:40px; min-height:40px; max-height:40px; }
    }
    @media (max-width:760px) and (max-height:660px) {
      .subtitle, .notice { display:none; }
      .round-progress { margin:0; }
      .question-overline { gap:7px; }
      .prompt-label { margin-top:8px; }
      .actions button { min-height:37px; }
      #feedback { height:34px; min-height:34px; max-height:34px; padding:6px 9px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div><span class="eyebrow">A1 · WORTSCHATZ TRAINING</span><h1>A1 德语背诵练习</h1><p class="subtitle">看中文，写德语；单词、短语和句子都能在这一屏完成。</p></div>
    <div class="count" id="totalCount"></div>
  </header>
  <section class="panel" aria-label="背诵练习">
    <aside class="rail" aria-label="练习设置">
      <div class="filters">
        <label>章节<select id="chapter"></select></label>
        <label>内容<select id="kind"><option value="all">全部</option><option value="word">单词</option><option value="phrase">短语与句子</option></select></label>
      </div>
      <div class="round-progress"><span class="progress-caption">本轮进度</span><div class="progress" aria-label="本轮进度"><div id="bar"></div></div></div>
      <div class="footer"><span id="status">准备开始</span><button id="restart">重新随机本轮</button></div>
      <p class="notice">词条发音使用固定音频；如果没有声音，请检查设备音量和浏览器播放权限。答案会忽略首尾空格、连续空格和部分标点差异。</p>
    </aside>
    <div class="study">
      <div class="question">
        <div class="question-overline"><span class="tag" id="tag"></span></div>
        <p class="prompt-label">请写出对应的德语：</p>
        <div id="meaning"></div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="answer-controls">
        <label class="answer-label" for="answer">你的答案<input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入德语，然后提交"></label>
        <div class="actions"><button class="primary" id="check">提交答案</button><button id="speak" title="朗读标准答案">🔊 听发音</button><button id="previous" disabled>上一题</button><button id="skip">下一题</button><button id="errorToggle">错题本（0）</button></div>
        <div id="feedback" role="status" aria-live="polite"></div>
      </div>
    </div>
    <aside id="errorBook" role="dialog" aria-modal="true" aria-label="错题本"><h2>错题本</h2><p id="errorEmpty">答错的内容会保存在这台设备的浏览器中。</p><ol id="errorList"></ol><button id="practiceErrors" class="primary">练习全部错题</button></aside>
  </section>
</main>

function next() { if (index < round.length - 1) { index++; display(); } else { $('#bar').style.width = '100%'; $('#meaning').textContent = `本轮完成！答对 ${correctIndices.size} / ${round.length} 题。`; $('#tag').textContent = '完成'; $('#hint').textContent = '点击“重新随机本轮”再练一次。'; answer.value = ''; answer.disabled = true; $('#check').disabled = true; $('#previous').disabled = true; $('#skip').disabled = true; $('#status').textContent = '练习完成'; }
}
function previous() { if (index > 0) { index--; display(); } }
function practiceErrors() { const list = errorEntries(); if (!list.length) return; errorMode = true; round = shuffle(list); index = 0; correctIndices = new Set(); answer.disabled=false; $('#check').disabled=false; $('#skip').disabled=false; $('#errorBook').classList.remove('show'); display(); }
function playFeedbackSound(isCorrect) {
  const speakFallback = () => { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(isCorrect ? '正确' : '错误'); utterance.lang = 'zh-CN'; utterance.rate = 1.35; speechSynthesis.speak(utterance); } };
  if (typeof Audio === 'undefined' || typeof Blob === 'undefined' || !URL.createObjectURL) { speakFallback(); return; }
  try {
    const sampleRate = 16000, length = 7200, buffer = new ArrayBuffer(44 + length * 2), view = new DataView(buffer);
    const write = (offset,text) => [...text].forEach((char,index) => view.setUint8(offset + index,char.charCodeAt(0)));
    write(0,'RIFF'); view.setUint32(4,36 + length * 2,true); write(8,'WAVEfmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate * 2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); write(36,'data'); view.setUint32(40,length * 2,true);
    for (let i = 0; i < length; i++) {
      const t = i / sampleRate, first = t < .13, second = t > .18 && t < .34, active = isCorrect ? first || second : t < .32;
      const frequency = isCorrect ? (first ? 784 : 1175) : (t < .16 ? 175 : 138), envelope = isCorrect ? (first ? Math.max(0,1 - t / .13) : Math.max(0,1 - (t - .18) / .16)) : Math.max(0,1 - t / .32);
      const wave = isCorrect ? Math.sin(2 * Math.PI * frequency * t) + .28 * Math.sin(4 * Math.PI * frequency * t) : Math.sign(Math.sin(2 * Math.PI * frequency * t)) * .72 + .18 * Math.sin(2 * Math.PI * frequency * t);
      view.setInt16(44 + i * 2,(active ? wave * envelope : 0) * 30000,true);
    }
    const url = URL.createObjectURL(new Blob([buffer],{type:'audio/wav'})), audio = new Audio(url); audio.volume = 1; audio.onended = () => URL.revokeObjectURL(url); audio.play().catch(() => { URL.revokeObjectURL(url); speakFallback(); });
  } catch { speakFallback(); }
}
function check() { if (!round.length || checked) return; const x = round[index], given = normalize(answer.value), expected = answersFor(x).map(normalize); if (!given) { feedback.className='no'; feedback.textContent='请先输入答案。'; return; } checked = true; if (expected.includes(given)) { correctIndices.add(index); const key = errorKey(x), wasError = Boolean(errors[key]); if (wasError) { delete errors[key]; saveErrors(); renderErrorBook(); } playFeedbackSound(true); feedback.className='ok'; feedback.innerHTML=wasError ? '✓ 正确！已从错题本移除。' : '✓ 正确！'; setTimeout(next, 750); } else { const key = errorKey(x); errors[key] = {...x, wrong: answer.value.trim()}; saveErrors(); renderErrorBook(); playFeedbackSound(false); feedback.className='no'; feedback.innerHTML=`✗ 还不对，已加入错题本。标准答案：<strong>${answersFor(x).join(' / ')}</strong>`; $('#status').textContent = `第 ${index + 1} / ${round.length} 题 · 可查看答案后跳过`; } }
function rebuildChapters() { const chapters = [...new Set(items.map(x => x.c))]; chapter.innerHTML = '<option value="all">全部章节</option>' + chapters.map(c => `<option value="${c}">${c}</option>`).join(''); $('#totalCount').textContent = `${items.length} 个词条`; }
chapter.addEventListener('change', resetRound); kind.addEventListener('change', resetRound); $('#check').addEventListener('click',check); $('#previous').addEventListener('click',previous); $('#skip').addEventListener('click',next); $('#speak').addEventListener('click',speak); $('#errorToggle').addEventListener('click',()=>$('#errorBook').classList.toggle('show')); $('#practiceErrors').addEventListener('click',practiceErrors); $('#restart').addEventListener('click',()=>{ answer.disabled=false; $('#check').disabled=false; $('#skip').disabled=false; resetRound(); }); answer.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
rebuildChapters(); renderErrorBook(); resetRound();
</script>
