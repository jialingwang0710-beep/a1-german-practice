<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>A1 德语背诵练习</title>
  <style>
    :root { --ink:#17202a; --muted:#64748b; --paper:#fffdf8; --green:#087f5b; --green-pale:#dcfce7; --red:#c92a2a; --red-pale:#fff1f2; --blue:#2f5d8c; --line:#dbe3ea; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(145deg,#e8f1f7 0%,#f9f4e8 70%); font-family:"Microsoft YaHei",system-ui,sans-serif; }
    main { max-width:850px; margin:auto; padding:28px 18px 42px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:22px; }
    h1 { margin:0; font-size:clamp(1.6rem,5vw,2.25rem); letter-spacing:.02em; }
    .subtitle { margin:7px 0 0; color:var(--muted); line-height:1.6; }
    .count { white-space:nowrap; padding:8px 12px; border-radius:99px; background:#fff; box-shadow:0 2px 10px #64748b22; color:var(--blue); font-weight:700; }
    .panel { background:var(--paper); border:1px solid #fff; box-shadow:0 13px 36px #274c5a18; border-radius:18px; padding:20px; }
    .filters { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
    label { display:block; color:#455568; font-size:.9rem; font-weight:700; }
    select, input { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:6px; background:#fff; color:var(--ink); font:inherit; }
    select:focus, input:focus { outline:3px solid #b8d6ee; border-color:var(--blue); }
    .progress { height:8px; background:#e9eef2; border-radius:10px; overflow:hidden; margin:4px 0 24px; }
    .progress > div { height:100%; width:0; transition:width .25s; background:linear-gradient(90deg,#326a95,#6a9fbe); }
    .tag { display:inline-block; color:#275876; background:#e8f4fa; padding:4px 9px; border-radius:99px; font-size:.82rem; font-weight:700; }
    .prompt-label { color:var(--muted); margin:17px 0 7px; font-size:.9rem; }
    #meaning { min-height:58px; font-size:clamp(1.25rem,4vw,1.75rem); font-weight:750; line-height:1.45; }
    .hint { min-height:23px; margin:8px 0; color:var(--muted); font-size:.9rem; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    button { appearance:none; border:0; border-radius:10px; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer; background:#e7eef3; color:#213242; }
    button.primary { color:#fff; background:var(--blue); } button:hover { filter:brightness(.96); } button:focus-visible { outline:3px solid #94c5e4; outline-offset:2px; }
    #feedback { min-height:49px; margin-top:16px; border-radius:10px; padding:13px; line-height:1.55; display:none; }
    #feedback.ok { display:block; color:#075b42; background:var(--green-pale); }
    #feedback.no { display:block; color:#a61e2a; background:var(--red-pale); }
    #feedback strong { font-family:system-ui,sans-serif; }
    #errorBook { display:none; margin-top:16px; padding:14px; border:1px solid #f0d7a9; border-radius:10px; background:#fffbeb; }
    #errorBook.show { display:block; } #errorBook h2 { margin:0 0 8px; font-size:1rem; } #errorBook p { margin:6px 0 12px; color:#6b5b38; font-size:.9rem; }
    #errorList { max-height:185px; overflow:auto; margin:0 0 12px; padding-left:20px; color:#5f3d15; line-height:1.6; font-size:.9rem; }
    #errorList li { margin:6px 0; } .wrong-answer { color:#a61e2a; }
    .footer { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:17px; color:var(--muted); font-size:.88rem; }
    .notice { margin:18px 2px 0; color:var(--muted); font-size:.84rem; line-height:1.6; }

</head>
<body>
<main>
  <header>
    <div><h1>A1 德语背诵练习</h1><p class="subtitle">看中文，写德语；答错会立即显示标准答案。单词、短语和句子均可练习。</p></div>
    <div class="count" id="totalCount"></div>
  </header>
  <section class="panel" aria-label="背诵练习">
    <div class="filters">
      <label>章节<select id="chapter"></select></label>
      <label>内容<select id="kind"><option value="all">全部</option><option value="word">单词</option><option value="phrase">短语与句子</option></select></label>
    </div>
    <div class="progress" aria-label="本轮进度"><div id="bar"></div></div>
    <span class="tag" id="tag"></span>
    <p class="prompt-label">请写出对应的德语：</p>
    <div id="meaning"></div>
    <div class="hint" id="hint"></div>
    <label for="answer">你的答案<input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入德语，然后提交"></label>
    <div class="actions"><button class="primary" id="check">提交答案</button><button id="speak" title="朗读标准答案">🔊 听发音</button><button id="previous" disabled>上一题</button><button id="skip">下一题</button><button id="errorToggle">错题本（0）</button></div>
    <div id="feedback" role="status" aria-live="polite"></div>
    <aside id="errorBook" aria-label="错题本"><h2>错题本</h2><p id="errorEmpty">答错的内容会保存在这台设备的浏览器中。</p><ol id="errorList"></ol><button id="practiceErrors" class="primary">练习全部错题</button></aside>
    <div class="footer"><span id="status">准备开始</span><button id="restart">重新随机本轮</button></div>
  </section>
  <p class="notice">发音由浏览器的德语语音提供；第一次点击后若没有声音，请确认设备音量及浏览器语音权限。答案会忽略首尾空格、连续空格和部分标点差异。</p>
</main>

const chapter = $('#chapter'), kind = $('#kind'), answer = $('#answer'), feedback = $('#feedback');
const ERROR_STORAGE_KEY = 'a1-vocabulary-error-book-v1';
const loadErrors = () => { try { return JSON.parse(localStorage.getItem(ERROR_STORAGE_KEY)) || {}; } catch { return {}; } };
let errors = loadErrors(), round = [], index = 0, correctIndices = new Set(), checked = false, errorMode = false;
const normalize = text => text.toLocaleLowerCase('de-DE').replace(/…|\.\.\./g,' ').replace(/[„“”"'.,!?؛;:()[\]{}–—-]/g,' ').replace(/\s+/g,' ').trim();
const saveErrors = () => localStorage.setItem(ERROR_STORAGE_KEY, JSON.stringify(errors));
const errorEntries = () => Object.values(errors);
function renderErrorBook() {
  const list = errorEntries(); $('#errorToggle').textContent = `错题本（${list.length}）`;
  $('#errorEmpty').textContent = list.length ? `共 ${list.length} 题。答对后会自动从错题本清除。` : '还没有错题，继续保持！';
  $('#errorList').innerHTML = list.map(x => `<li><b>${x.zh}</b><br><span class="wrong-answer">你的答案：${x.wrong || '（未填写）'}</span><br>标准答案：${x.de}</li>`).join('');
  $('#practiceErrors').disabled = !list.length;
}
function choices() { const c = chapter.value, k = kind.value; return items.filter(x => (c === 'all' || x.c === c) && (k === 'all' || x.k === k)); }
function shuffle(xs) { return [...xs].sort(() => Math.random() - .5); }
function display() {
  if (!round.length) { $('#meaning').textContent = '当前筛选没有词条。'; return; }
  const x = round[index]; checked = false; feedback.className = ''; feedback.textContent = ''; answer.value = '';
  $('#meaning').textContent = x.zh; $('#tag').textContent = `${x.c} · ${x.k === 'word' ? '单词' : '短语与句子'}`;
  $('#hint').textContent = x.de.includes('…') ? '提示：省略号（…）表示可替换的内容；请照标准句型输入。' : '';
  $('#status').textContent = `第 ${index + 1} / ${round.length} 题 · 答对 ${correctIndices.size} 题`;
  $('#bar').style.width = `${(index / round.length) * 100}%`; $('#previous').disabled = index === 0; answer.focus();
}
function resetRound() { errorMode = false; round = shuffle(choices()); index = 0; correctIndices = new Set(); $('#errorBook').classList.remove('show'); display(); }
function speak() { if (!round.length || !('speechSynthesis' in window)) { alert('此浏览器不支持朗读功能。'); return; } speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(round[index].de.replace('…','')); u.lang = 'de-DE'; u.rate = .82; speechSynthesis.speak(u); }
function next() { if (index < round.length - 1) { index++; display(); } else { $('#bar').style.width = '100%'; $('#meaning').textContent = `本轮完成！答对 ${correctIndices.size} / ${round.length} 题。`; $('#tag').textContent = '完成'; $('#hint').textContent = '点击“重新随机本轮”再练一次。'; answer.value = ''; answer.disabled = true; $('#check').disabled = true; $('#previous').disabled = true; $('#skip').disabled = true; $('#status').textContent = '练习完成'; }
}
function previous() { if (index > 0) { index--; display(); } }
function practiceErrors() { const list = errorEntries(); if (!list.length) return; errorMode = true; round = shuffle(list); index = 0; correctIndices = new Set(); answer.disabled=false; $('#check').disabled=false; $('#skip').disabled=false; $('#errorBook').classList.remove('show'); display(); }
function check() { if (!round.length || checked) return; const x = round[index], given = normalize(answer.value), expected = normalize(x.de); if (!given) { feedback.className='no'; feedback.textContent='请先输入答案。'; return; } checked = true; if (given === expected) { correctIndices.add(index); const wasError = Boolean(errors[x.de]); if (wasError) { delete errors[x.de]; saveErrors(); renderErrorBook(); } feedback.className='ok'; feedback.innerHTML=wasError ? '✓ 正确！已从错题本移除。' : '✓ 正确！'; setTimeout(next, 750); } else { errors[x.de] = {...x, wrong: answer.value.trim()}; saveErrors(); renderErrorBook(); feedback.className='no'; feedback.innerHTML=`✗ 还不对，已加入错题本。标准答案：<strong>${x.de}</strong>`; $('#status').textContent = `第 ${index + 1} / ${round.length} 题 · 可查看答案后跳过`; } }
function rebuildChapters() { const chapters = [...new Set(items.map(x => x.c))]; chapter.innerHTML = '<option value="all">全部章节</option>' + chapters.map(c => `<option value="${c}">${c}</option>`).join(''); $('#totalCount').textContent = `${items.length} 个词条`; }
chapter.addEventListener('change', resetRound); kind.addEventListener('change', resetRound); $('#check').addEventListener('click',check); $('#previous').addEventListener('click',previous); $('#skip').addEventListener('click',next); $('#speak').addEventListener('click',speak); $('#errorToggle').addEventListener('click',()=>$('#errorBook').classList.toggle('show')); $('#practiceErrors').addEventListener('click',practiceErrors); $('#restart').addEventListener('click',()=>{ answer.disabled=false; $('#check').disabled=false; $('#skip').disabled=false; resetRound(); }); answer.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
rebuildChapters(); renderErrorBook(); resetRound();
</script>
</body>
</html>
